name = "campusflow-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# ── D1 Database ──
[[d1_databases]]
binding = "campusflow_db"
database_name = "campusflow-db"
database_id = "af9f1e96-be34-4c7e-91e0-dae2fafd9cb7"

# ── Workers AI (for assistant) ──
[ai]
binding = "AI"

# ── Environment variables ──
[vars]
ENVIRONMENT = "production"